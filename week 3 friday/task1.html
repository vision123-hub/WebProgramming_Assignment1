
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Position the Badge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: clamp(16px, 5vw, 50px);
            font-family: Arial, sans-serif;
            background-color: #f0fdfa;
        }

        .card {
            width: min(280px, 100%);
            min-height: 180px;
            background-color: white;
            border: 2px solid #14b8a6;
            border-radius: 12px;

            /* Required for absolute positioning */
            position: relative;

            padding: 30px;
        }

        .card h1 {
            margin-top: 25px;
            color: #0f766e;
        }

        .card p {
            color: #64748b;
        }

        .badge {
            position: absolute;
            top: -12px;
            right: 16px;

            background-color: #0f766e;
            color: white;

            font-size: 12px;
            font-weight: bold;

            padding: 4px 12px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <main>
    <div class="card">

        <span class="badge">SALE</span>

        <h1>Special Offer</h1>

        <p>
            This card demonstrates CSS positioning.
        </p>

    </div>
    </main>

</body>
</html>
