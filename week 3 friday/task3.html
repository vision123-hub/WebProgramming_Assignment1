
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Loading Spinner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background-color: #f0fdfa;
        }

        .container {
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;

            margin: 0 auto 20px;

            border: 5px solid #ccfbf1;
            border-top-color: #0f766e;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .text {
            color: #0f766e;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="spinner"></div>

        <div class="text">
            Loading...
        </div>

    </div>

</body>
</html>
