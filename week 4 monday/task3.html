<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Monday - Task 3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        #todo-input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .add-row label {
            position: absolute;
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        #add-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        #todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background-color: #f1f5f9;
            border-radius: 6px;
        }

        .del-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        #empty-msg {
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>

    <main>
    <h1>My To-Do List</h1>

    <div class="add-row">
        <label for="todo-input">New task</label>
        <input
            id="todo-input"
            type="text"
            placeholder="Add a task..."
        >

        <button id="add-btn" type="button">+ Add</button>
    </div>

    <ul id="todo-list"></ul>

    <p id="empty-msg">No tasks yet! Add one above.</p>

    </main>
    <script>
        const input = document.querySelector("#todo-input");
        const addBtn = document.querySelector("#add-btn");
        const list = document.querySelector("#todo-list");
        const emptyMsg = document.querySelector("#empty-msg");

        function updateEmpty() {
            emptyMsg.style.display =
                list.children.length === 0 ? "block" : "none";
        }

        function addTask() {
            const text = input.value.trim();

            if (!text) {
                return;
            }

            const li = document.createElement("li");
            li.className = "todo-item";

            const task = document.createElement("span");
            task.textContent = text;

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "del-btn";
            deleteButton.setAttribute("aria-label", `Delete ${text}`);
            deleteButton.textContent = "✕";

            li.append(task, deleteButton);

            list.appendChild(li);

            input.value = "";

            updateEmpty();
        }

        addBtn.addEventListener("click", addTask);

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                addTask();
            }
        });

        list.addEventListener("click", (e) => {
            if (e.target instanceof Element && e.target.closest(".del-btn")) {
                e.target.closest("li").remove();
                updateEmpty();
            }
        });

        updateEmpty();
    </script>

</body>
</html>
