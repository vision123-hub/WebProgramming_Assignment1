<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Monday - Task 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }

        #clicker {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        #clicker.done {
            background-color: green;
        }

        #count {
            font-size: 20px;
            margin-top: 20px;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Task 1: Click Counter</h1>

    <button id="clicker">Click me!</button>

    <p>Clicks: <span id="count">0</span></p>

    <p id="message">Keep clicking...</p>

    <script>
        const btn = document.querySelector("#clicker");
        const countEl = document.querySelector("#count");
        const msg = document.querySelector("#message");

        let count = 0;

        btn.addEventListener("click", () => {
            count++;

            countEl.textContent = count;

            if (count >= 5) {
                btn.classList.add("done");
                msg.textContent = "Congratulations! You reached 5 clicks!";
            }
        });
    </script>

</body>
</html>
