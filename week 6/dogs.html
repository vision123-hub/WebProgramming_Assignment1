<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Dog</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#dbeafe;color:#1e3a8a;margin:0;padding:24px}
main{background:white;max-width:680px;margin:20px auto;padding:30px;border-radius:18px;box-shadow:0 5px 20px #0002;text-align:center}
h1{color:#2563eb}
button,a{background:#2563eb;color:white;border:0;padding:13px 22px;border-radius:9px;cursor:pointer;text-decoration:none;font:inherit}
button:disabled{opacity:.5;cursor:wait}
img{max-width:100%;max-height:450px;border-radius:15px;margin-top:20px;object-fit:contain}
#status{min-height:1.5em}
.error{color:#b91c1c}.success{color:#166534}
</style>
</head>
<body>
<main>
<a href="index.html">← Week 6</a>
<h1>🐶 Random Dog</h1>
<p>Load a random dog photo from the Dog CEO public API.</p>
<button id="btn" type="button">Show another dog</button>
<p id="status" role="status" aria-live="polite">Press the button to load a dog.</p>
<img id="dogImage" alt="Random dog" hidden>
</main>
<script>
const button = document.getElementById("btn");
const status = document.getElementById("status");
const image = document.getElementById("dogImage");

button.addEventListener("click", async () => {
  button.disabled = true;
  image.hidden = true;
  status.className = "";
  status.textContent = "Loading a dog photo…";
  try {
    const response = await fetch("https://dog.ceo/api/breeds/image/random");
    if (!response.ok) throw new Error(`Dog CEO request failed with HTTP ${response.status}`);
    const data = await response.json();
    if (data.status !== "success" || typeof data.message !== "string") {
      throw new Error("Dog CEO returned an unexpected response.");
    }
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error("The dog photo could not be displayed."));
      image.src = data.message;
    });
    image.alt = `Random dog${data.message.split("/").at(-2) ? `, ${data.message.split("/").at(-2)} breed` : ""}`;
    image.hidden = false;
    status.className = "success";
    status.textContent = "Your dog photo loaded successfully.";
  } catch (error) {
    status.className = "error";
    status.textContent = `Could not load a dog: ${error.message}`;
    console.error(error);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
