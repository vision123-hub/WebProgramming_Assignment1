<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Joke Generator</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#fff0c2;color:#78350f;margin:0;padding:24px}
main{background:white;max-width:700px;margin:20px auto;padding:30px;border-radius:18px;box-shadow:0 5px 20px #0002}
h1{color:#e87519}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button,a{background:#f97316;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;text-decoration:none;font:inherit}
button:disabled{opacity:.5;cursor:wait}
#result{background:#fff7e8;padding:20px;margin-top:20px;border-radius:12px}
#punchline{color:#b45309;font-weight:bold}
#favourites{padding-left:22px}
.favourite{margin:12px 0}
.remove{padding:6px 10px;margin-left:10px;background:#9a3412}
#status{min-height:1.5em}
.error{color:#b91c1c}.success{color:#166534}
</style>
</head>
<body>
<main>
<a href="index.html">← Week 6</a>
<h1>😂 Joke Factory</h1>
<p>Load a random joke and save your favourites on this device.</p>
<div class="actions">
<button id="btn" type="button">Load Joke</button>
<button id="save" type="button" disabled>Save Favourite</button>
</div>
<p id="status" role="status" aria-live="polite">Load a joke to get started.</p>
<div id="result">
<h2 id="setup">Your joke will appear here.</h2>
<p id="punchline"></p>
</div>
<section aria-labelledby="favouritesTitle">
<h2 id="favouritesTitle">Saved favourites</h2>
<p id="emptyFavourites">No favourite jokes saved yet.</p>
<ul id="favourites"></ul>
</section>
</main>
<script>
const loadButton = document.getElementById("btn");
const saveButton = document.getElementById("save");
const status = document.getElementById("status");
const setup = document.getElementById("setup");
const punchline = document.getElementById("punchline");
const favouritesList = document.getElementById("favourites");
const emptyFavourites = document.getElementById("emptyFavourites");
const storageKey = "week6-favourite-jokes";
let currentJoke = null;
let favourites = [];

function readFavourites() {
  try {
    const stored = JSON.parse(localStorage.getItem(storageKey) || "[]");
    if (!Array.isArray(stored)) throw new Error("Saved favourite data has an invalid format.");
    favourites = stored.filter(joke =>
      Number.isInteger(joke.id) && typeof joke.setup === "string" && typeof joke.punchline === "string"
    );
    renderFavourites();
  } catch (error) {
    status.className = "error";
    status.textContent = `Could not read saved favourites: ${error.message}`;
    console.error(error);
  }
}

function renderFavourites() {
  favouritesList.replaceChildren();
  emptyFavourites.hidden = favourites.length > 0;
  for (const joke of favourites) {
    const item = document.createElement("li");
    item.className = "favourite";
    const text = document.createElement("span");
    text.textContent = `${joke.setup} — ${joke.punchline}`;
    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.className = "remove";
    removeButton.textContent = "Remove";
    removeButton.addEventListener("click", () => removeFavourite(joke.id));
    item.append(text, removeButton);
    favouritesList.append(item);
  }
}

function saveFavourites() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(favourites));
    renderFavourites();
    return true;
  } catch (error) {
    status.className = "error";
    status.textContent = `Could not save favourites in this browser: ${error.message}`;
    console.error(error);
    return false;
  }
}

function removeFavourite(id) {
  favourites = favourites.filter(joke => joke.id !== id);
  if (saveFavourites()) {
    status.className = "success";
    status.textContent = "Favourite removed.";
  }
}

loadButton.addEventListener("click", async () => {
  loadButton.disabled = true;
  saveButton.disabled = true;
  currentJoke = null;
  setup.textContent = "";
  punchline.textContent = "";
  status.className = "";
  status.textContent = "Loading a joke…";
  try {
    const response = await fetch("https://official-joke-api.appspot.com/random_joke");
    if (!response.ok) throw new Error(`Official Joke API request failed with HTTP ${response.status}`);
    const joke = await response.json();
    if (!Number.isInteger(joke.id) || !joke.setup || !joke.punchline) {
      throw new Error("The Joke API returned an unexpected response.");
    }
    currentJoke = joke;
    setup.textContent = joke.setup;
    punchline.textContent = joke.punchline;
    saveButton.disabled = false;
    status.className = "success";
    status.textContent = "Joke loaded successfully.";
  } catch (error) {
    status.className = "error";
    status.textContent = `Could not load a joke: ${error.message}`;
    console.error(error);
  } finally {
    loadButton.disabled = false;
  }
});

saveButton.addEventListener("click", () => {
  if (!currentJoke) return;
  if (favourites.some(joke => joke.id === currentJoke.id)) {
    status.className = "success";
    status.textContent = "This joke is already in your favourites.";
    return;
  }
  favourites.push(currentJoke);
  if (saveFavourites()) {
    status.className = "success";
    status.textContent = "Joke saved to your favourites.";
  }
});

readFavourites();
</script>
</body>
</html>
