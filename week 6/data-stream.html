<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Stream Explorer</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eff6ff;color:#172554;margin:0;padding:24px}
main{max-width:1000px;margin:auto}
.topbar,.controls,.stats{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel,.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 14px #0f172a12}
.controls{margin:18px 0}
button,a{border:0;border-radius:8px;padding:11px 16px;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer;font:inherit}
button:disabled{opacity:.55;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:18px 0}
.stat strong{display:block;font-size:1.5rem;margin-top:8px}
#posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card h2{font-size:1.05rem;text-transform:capitalize}
.meta{color:#475569;font-size:.9rem}
#status{min-height:1.5em}
.error{color:#b91c1c}.success{color:#166534}
@media(max-width:600px){body{padding:14px}.panel,.card{padding:16px}}
</style>
</head>
<body>
<main>
<div class="topbar">
<div><a href="index.html">← Week 6</a><h1>📡 Data Stream Explorer</h1></div>
<p>Public post feed · refreshes every 30 seconds</p>
</div>
<section class="panel">
<div class="controls">
<button id="refresh" type="button">Refresh now</button>
<button id="autoRefresh" type="button" aria-pressed="true">Pause auto-refresh</button>
</div>
<p id="status" role="status" aria-live="polite">Loading public data…</p>
<div class="stats">
<div class="panel stat">Posts loaded<strong id="postCount">—</strong></div>
<div class="panel stat">Authors represented<strong id="authorCount">—</strong></div>
<div class="panel stat">Last updated<strong id="lastUpdated">—</strong></div>
</div>
<section id="posts" aria-label="Latest posts"></section>
</section>
</main>
<script>
const refreshButton = document.getElementById("refresh");
const autoButton = document.getElementById("autoRefresh");
const status = document.getElementById("status");
const postsElement = document.getElementById("posts");
let timer = null;

async function loadPosts() {
  refreshButton.disabled = true;
  status.className = "";
  status.textContent = "Loading public posts…";
  try {
    const response = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=12");
    if (!response.ok) throw new Error(`Request failed with HTTP ${response.status}`);
    const posts = await response.json();
    if (!Array.isArray(posts)) throw new Error("The API returned an unexpected response.");
    postsElement.replaceChildren();
    if (posts.length === 0) {
      status.textContent = "The API returned no posts.";
      document.getElementById("postCount").textContent = "0";
      document.getElementById("authorCount").textContent = "0";
      document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString();
      return;
    }
    const fragment = document.createDocumentFragment();
    for (const post of posts) {
      const card = document.createElement("article");
      card.className = "card";
      const title = document.createElement("h2");
      title.textContent = post.title || "Untitled post";
      const body = document.createElement("p");
      body.textContent = post.body || "No post text.";
      const author = document.createElement("p");
      author.className = "meta";
      author.textContent = `Author ID: ${post.userId ?? "Unknown"} · Post #${post.id ?? "?"}`;
      card.append(title, body, author);
      fragment.append(card);
    }
    postsElement.append(fragment);
    document.getElementById("postCount").textContent = String(posts.length);
    document.getElementById("authorCount").textContent =
      String(new Set(posts.map(post => post.userId)).size);
    document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString();
    status.className = "success";
    status.textContent = "Public data loaded successfully.";
  } catch (error) {
    status.className = "error";
    status.textContent = `Could not load the data stream: ${error.message}`;
    console.error(error);
  } finally {
    refreshButton.disabled = false;
  }
}

function setAutoRefresh(enabled) {
  if (timer !== null) clearInterval(timer);
  timer = enabled ? setInterval(loadPosts, 30000) : null;
  autoButton.textContent = enabled ? "Pause auto-refresh" : "Resume auto-refresh";
  autoButton.setAttribute("aria-pressed", String(enabled));
}

refreshButton.addEventListener("click", loadPosts);
autoButton.addEventListener("click", () => setAutoRefresh(timer === null));
setAutoRefresh(true);
loadPosts();
</script>
</body>
</html>
