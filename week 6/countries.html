<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Demographics</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#dcfce7;color:#14532d;margin:0;padding:24px}
main{max-width:900px;margin:20px auto}
.panel,.card{background:white;padding:22px;border-radius:16px;box-shadow:0 5px 20px #0002}
h1{color:#15803d}
form{display:flex;gap:10px;flex-wrap:wrap}
label{align-self:center}
input,button{font:inherit;padding:12px;border-radius:8px}
input{border:1px solid #aaa;flex:1;min-width:190px}
button,a{background:#16a34a;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:wait}
#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.card img{width:150px;max-width:100%;max-height:100px;object-fit:contain;border-radius:8px}
#status{min-height:1.5em}
.error{color:#b91c1c}.success{color:#166534}
@media(max-width:520px){body{padding:14px}.panel,.card{padding:16px}form{display:grid;grid-template-columns:1fr}input{width:100%}}
</style>
</head>
<body>
<main>
<a href="api-tasks.html">← Week 6</a>
<h1>🌍 Country Demographics</h1>
<p>Search country details using public World Bank country data.</p>
<section class="panel">
<form id="form">
<label for="query">Country name</label>
<input id="query" placeholder="Try Nepal or Canada" required maxlength="80">
<button id="btn" type="submit">Search countries</button>
</form>
<p id="status" role="status" aria-live="polite">Enter a country name to search.</p>
<section id="results" aria-label="Country search results"></section>
</section>
</main>
<script>
const form = document.getElementById("form");
const queryInput = document.getElementById("query");
const button = document.getElementById("btn");
const status = document.getElementById("status");
const results = document.getElementById("results");

function addDetail(card, label, value) {
  const detail = document.createElement("p");
  detail.textContent = `${label}: ${value || "Unavailable"}`;
  card.append(detail);
}

async function fetchJson(url, serviceName, options = {}) {
  let response;
  try {
    const { headers, ...requestOptions } = options;
    response = await fetch(url, {
      ...requestOptions,
      headers: { Accept: "application/json", ...headers }
    });
  } catch (error) {
    if (error instanceof TypeError) {
      throw new Error(`Network or browser CORS error while contacting ${serviceName}. Check your connection and browser console.`);
    }
    throw error;
  }
  if (!response.ok) {
    throw new Error(`${serviceName} returned HTTP ${response.status}.`);
  }
  try {
    return await response.json();
  } catch {
    throw new Error(`${serviceName} returned invalid JSON.`);
  }
}

function normalizeName(name) {
  return name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const query = queryInput.value.trim();
  if (!query) return;
  button.disabled = true;
  results.replaceChildren();
  status.className = "";
  status.textContent = "Loading country results…";
  try {
    const catalog = await fetchJson(
      "https://api.worldbank.org/v2/country?format=json&per_page=300",
      "World Bank country API"
    );
    if (!Array.isArray(catalog) || !Array.isArray(catalog[1])) {
      throw new Error("World Bank country API returned an unexpected response.");
    }
    const countries = catalog[1].filter(country =>
      country.region?.value && country.region.value !== "Aggregates" && country.iso2Code
    );
    const aliases = {
      "south korea": "KOR",
      "korea, south": "KOR",
      "korea south": "KOR",
      "republic of korea": "KOR",
      "north korea": "PRK",
      "korea, north": "PRK"
    };
    const queryName = normalizeName(query);
    const aliasCode = aliases[queryName];
    let matches = aliasCode
      ? countries.filter(country => country.id === aliasCode)
      : countries.filter(country => normalizeName(country.name) === queryName);
    if (matches.length === 0) {
      matches = countries.filter(country => normalizeName(country.name).startsWith(queryName));
    }
    if (matches.length === 0) {
      matches = countries.filter(country => normalizeName(country.name).includes(queryName));
    }
    matches = matches.slice(0, 12);
    if (matches.length === 0) {
      status.textContent = `No country found for “${query}”. Check the spelling and try again.`;
      return;
    }

    const countriesWithPopulation = await Promise.all(matches.map(async country => {
      const [populationData, currencyData] = await Promise.all([
        fetchJson(
          `https://api.worldbank.org/v2/country/${encodeURIComponent(country.id)}/indicator/SP.POP.TOTL?format=json&per_page=1`,
          "World Bank population API"
        ),
        fetchJson("https://countries.trevorblades.com/", "Country currency API", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: `{ country(code: "${country.iso2Code}") { currency } }`
          })
        })
      ]);
      if (!Array.isArray(populationData) || !Array.isArray(populationData[1])) {
        throw new Error("World Bank population API returned an unexpected response.");
      }
      if (currencyData.errors || !currencyData.data) {
        throw new Error("Country currency API returned an unexpected response.");
      }
      return {
        country,
        population: populationData[1][0]?.value,
        currency: currencyData.data.country?.currency
      };
    }));

    const fragment = document.createDocumentFragment();
    for (const { country, population, currency } of countriesWithPopulation) {
      const card = document.createElement("article");
      card.className = "card";
      const title = document.createElement("h2");
      title.textContent = country.id === "KOR" ? "South Korea" : country.name;
      const flag = document.createElement("img");
      flag.src = `https://flagcdn.com/w160/${country.iso2Code.toLowerCase()}.png`;
      flag.alt = `Flag of ${title.textContent}`;
      flag.loading = "lazy";
      card.append(flag);
      card.append(title);
      addDetail(card, "Capital", country.capitalCity);
      addDetail(card, "Region", country.region.value.trim());
      addDetail(card, "Population", Number.isFinite(population) ? population.toLocaleString() : "");
      addDetail(card, "Currency", currency);
      fragment.append(card);
    }
    results.append(fragment);
    status.className = "success";
    status.textContent = `Loaded ${countriesWithPopulation.length} countr${countriesWithPopulation.length === 1 ? "y" : "ies"}.`;
  } catch (error) {
    status.className = "error";
    status.textContent = `Could not load country data: ${error.message}`;
    console.error(error);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
