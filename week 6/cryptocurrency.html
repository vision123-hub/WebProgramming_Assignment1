<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptocurrency Tracker</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#fffbeb;color:#422006;margin:0;padding:24px}
main{max-width:1050px;margin:auto}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}
select,button{font:inherit;padding:11px 14px;border:1px solid #d6d3d1;border-radius:8px}
button,a{background:#d97706;color:white;text-decoration:none;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.55}
#coins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.coin{background:white;padding:20px;border-radius:14px;box-shadow:0 4px 14px #42200612}
.coin-head{display:flex;align-items:center;gap:12px}
.coin img{width:42px;height:42px}
.price{font-size:1.4rem;font-weight:bold}
.positive{color:#15803d}.negative{color:#b91c1c}
#status{min-height:1.5em}
.error{color:#b91c1c}.success{color:#166534}
</style>
</head>
<body>
<main>
<a href="index.html">← Week 6</a>
<h1>₿ Cryptocurrency Tracker</h1>
<p>Market prices from CoinGecko. No API key is included in this public page.</p>
<section class="controls">
<label for="currency">Display currency</label>
<select id="currency">
<option value="usd">USD</option>
<option value="eur">EUR</option>
<option value="gbp">GBP</option>
</select>
<button id="refresh" type="button">Refresh prices</button>
</section>
<p id="status" role="status" aria-live="polite">Loading market data…</p>
<section id="coins" aria-label="Cryptocurrency prices"></section>
</main>
<script>
const currencySelect = document.getElementById("currency");
const refreshButton = document.getElementById("refresh");
const status = document.getElementById("status");
const coinsElement = document.getElementById("coins");

async function loadCoins() {
  const currency = currencySelect.value;
  refreshButton.disabled = true;
  coinsElement.replaceChildren();
  status.className = "";
  status.textContent = "Loading cryptocurrency prices…";
  try {
    const url = new URL("https://api.coingecko.com/api/v3/coins/markets");
    url.search = new URLSearchParams({
      vs_currency: currency,
      order: "market_cap_desc",
      per_page: "12",
      page: "1",
      sparkline: "false"
    });
    const response = await fetch(url);
    if (!response.ok) throw new Error(`CoinGecko request failed with HTTP ${response.status}`);
    const coins = await response.json();
    if (!Array.isArray(coins)) throw new Error("CoinGecko returned an unexpected response.");
    coinsElement.replaceChildren();
    if (coins.length === 0) {
      status.textContent = "No market results are currently available.";
      return;
    }
    const formatter = new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: currency.toUpperCase(),
      maximumFractionDigits: 2
    });
    const fragment = document.createDocumentFragment();
    for (const coin of coins) {
      const card = document.createElement("article");
      card.className = "coin";
      const heading = document.createElement("div");
      heading.className = "coin-head";
      if (coin.image) {
        const image = document.createElement("img");
        image.src = coin.image;
        image.alt = "";
        image.loading = "lazy";
        heading.append(image);
      }
      const title = document.createElement("h2");
      title.textContent = `${coin.name} (${coin.symbol.toUpperCase()})`;
      heading.append(title);
      const price = document.createElement("p");
      price.className = "price";
      price.textContent = formatter.format(coin.current_price);
      const change = document.createElement("p");
      const percentage = Number(coin.price_change_percentage_24h);
      change.className = Number.isFinite(percentage) && percentage < 0 ? "negative" : "positive";
      change.textContent = `24-hour change: ${Number.isFinite(percentage) ? `${percentage.toFixed(2)}%` : "Unavailable"}`;
      const marketCap = document.createElement("p");
      marketCap.textContent = `Market capitalization: ${
        Number.isFinite(coin.market_cap) ? formatter.format(coin.market_cap) : "Unavailable"
      }`;
      card.append(heading, price, change, marketCap);
      fragment.append(card);
    }
    coinsElement.append(fragment);
    status.className = "success";
    status.textContent = `Showing ${coins.length} currencies. Updated ${new Date().toLocaleTimeString()}.`;
  } catch (error) {
    status.className = "error";
    status.textContent = error instanceof TypeError
      ? "Could not connect to CoinGecko. Check your connection, or try again later if the public API is unavailable."
      : error.message.includes("HTTP 429")
        ? "CoinGecko is rate-limiting requests. Please wait a moment before trying again."
        : `Could not load market data: ${error.message}`;
    console.error(error);
  } finally {
    refreshButton.disabled = false;
  }
}

refreshButton.addEventListener("click", loadCoins);
currencySelect.addEventListener("change", loadCoins);
loadCoins();
</script>
</body>
</html>
