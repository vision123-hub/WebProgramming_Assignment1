<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Registration Module</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .skip-link { position: absolute; top: -4rem; left: 1rem; z-index: 1000; padding: 0.75rem 1rem; background: #ffffff; color: #111827; border: 2px solid #1e4638; border-radius: 0.25rem; }
        .skip-link:focus { top: 1rem; outline: 3px solid #facc15; outline-offset: 2px; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #ecf0ec; padding: 2.5rem 1rem; display: flex; justify-content: center; }
        .record-card { background-color: #ffffff; width: 100%; max-width: 480px; padding: 2.5rem; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .record-lead-zone { text-align: center; margin-bottom: 2rem; }
        .record-lead-zone h1 { color: #1e4638; font-size: 1.75rem; font-weight: 800; margin-bottom: 0.35rem; }
        .record-lead-zone p { color: #4b5563; font-size: 0.875rem; }
        .record-block { border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .record-block legend { font-size: 0.875rem; font-weight: 700; color: #111827; padding: 0 0.5rem; }
        .record-node { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .record-node label { font-size: 0.85rem; font-weight: 700; color: #374151; }
        .record-input, .record-select { width: 100%; padding: 0.7rem 0.85rem; border: 1px solid #e5e7eb; border-radius: 0.375rem; font-size: 0.95rem; color: #111827; background-color: #ffffff; outline: none; }
        .record-input:focus, .record-select:focus { border-color: #10b981; outline: 3px solid #2563eb; outline-offset: 2px; }
        form.was-validated .record-input:valid, form.was-validated .record-select:valid { border-color: #15803d; }
        form.was-validated .record-input:invalid, form.was-validated .record-select:invalid { border-color: #b91c1c; }
        .record-input::placeholder { color: #9ca3af; }
        .record-hint { font-size: 0.775rem; color: #6b7280; margin-top: 0.2rem; }
        .record-error { color: #991b1b; font-size: 0.8rem; font-weight: 600; }
        .record-error-summary { color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.375rem; padding: 0.75rem; margin-bottom: 1rem; }
        .record-error-summary[hidden], .record-error[hidden] { display: none; }
        .record-submit { padding: 0.75rem 1.25rem; background: #1e4638; color: #ffffff; border: 0; border-radius: 0.375rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .record-submit:hover { background: #112921; }
        .record-submit:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
        @media (max-width: 480px) { .record-card { padding: 1.5rem; } }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main class="record-card" id="main-content" tabindex="-1">
        <div class="record-lead-zone">
            <h1>Student Registration</h1>
            <p>Forms collect the details needed to create your student account. Complete the required information to register.</p>
        </div>
        <form id="registrationForm">
            <div class="record-error-summary" id="form-error-summary" role="alert" aria-live="assertive" hidden></div>
            
            <!-- SECTION ONE -->
            <fieldset class="record-block">
                <legend>Personal Info</legend>
                <div class="record-node">
                    <label for="sName">Full Name</label>
                    <input type="text" id="sName" class="record-input" required minlength="2" maxlength="60" autocomplete="name" aria-describedby="sNameError" placeholder="Enter your full name">
                    <span class="record-error" id="sNameError" hidden></span>
                </div>
                <div class="record-node">
                    <label for="sId">Student ID</label>
                    <input type="text" id="sId" class="record-input" required minlength="9" maxlength="9" pattern="[0-9]{9}" title="Enter exactly 9 digits." aria-describedby="sIdError" placeholder="202112345">
                    <span class="record-error" id="sIdError" hidden></span>
                </div>
                <div class="record-node">
                    <label for="sDob">Date of Birth</label>
                    <input type="date" id="sDob" class="record-input" required aria-describedby="sDobError">
                    <span class="record-error" id="sDobError" hidden></span>
                </div>
                <div class="record-node">
                    <label for="sMajor">Major</label>
                    <select id="sMajor" class="record-select" required aria-describedby="sMajorError">
                        <option value="" disabled selected>Select your major</option>
                        <option value="cs">Computer Science & Engineering</option>
                        <option value="ai">Artificial Intelligence</option>
                        <option value="se">Software Engineering</option>
                    </select>
                    <span class="record-error" id="sMajorError" hidden></span>
                </div>
            </fieldset>

            <!-- SECTION TWO -->
            <fieldset class="record-block">
                <legend>Account Info</legend>
                <div class="record-node">
                    <label for="sEmail">Email</label>
                    <input type="email" id="sEmail" class="record-input" required autocomplete="email" aria-describedby="sEmailError" placeholder="name@example.com">
                    <span class="record-error" id="sEmailError" hidden></span>
                </div>
                <div class="record-node">
                    <label for="sPass">Password</label>
                    <input type="password" id="sPass" class="record-input" required minlength="8" maxlength="64" autocomplete="new-password" aria-describedby="sPassError" placeholder="At least 8 characters">
                    <span class="record-error" id="sPassError" hidden></span>
                </div>
                <div class="record-node">
                    <label for="sPhone">Phone</label>
                    <input type="tel" id="sPhone" class="record-input" required placeholder="010-1234-5678" pattern="010-[0-9]{4}-[0-9]{4}" title="Enter a phone number in the format 010-1234-5678." aria-describedby="sPhoneHint sPhoneError">
                    <div class="record-hint" id="sPhoneHint">Format: 010-1234-5678</div>
                    <span class="record-error" id="sPhoneError" hidden></span>
                </div>
            </fieldset>
            
            <button type="submit" class="record-submit">Submit Registration</button>
        </form>
    </main>
    <script>
        const registrationForm = document.getElementById("registrationForm");
        const registrationFields = Array.from(registrationForm.querySelectorAll("input, select"));
        const errorSummary = document.getElementById("form-error-summary");
        registrationForm.noValidate = true;

        function getErrorMessage(field) {
            if (field.validity.valueMissing) return "This field is required.";
            if (field.validity.typeMismatch) return "Enter a valid email address.";
            if (field.validity.tooShort) return `Enter at least ${field.minLength} characters.`;
            if (field.validity.tooLong) return `Enter no more than ${field.maxLength} characters.`;
            if (field.validity.patternMismatch) return field.title || "Use the requested format.";
            if (field.validity.rangeUnderflow) return `Enter a value of at least ${field.min}.`;
            if (field.validity.rangeOverflow) return `Enter a value no greater than ${field.max}.`;
            return "Check this value and try again.";
        }

        function updateFieldError(field) {
            const error = document.getElementById(`${field.id}Error`);
            const invalid = !field.validity.valid;
            field.setAttribute("aria-invalid", String(invalid));
            error.textContent = invalid ? getErrorMessage(field) : "";
            error.hidden = !invalid;
        }

        function updateErrorSummary() {
            const invalidCount = registrationFields.filter((field) => !field.validity.valid).length;
            errorSummary.hidden = invalidCount === 0;
            errorSummary.textContent = invalidCount === 1
                ? "Please correct the highlighted field before submitting."
                : `Please correct the ${invalidCount} highlighted fields before submitting.`;
        }

        registrationFields.forEach((field) => {
            field.addEventListener("input", () => {
                if (!registrationForm.classList.contains("was-validated")) return;
                updateFieldError(field);
                updateErrorSummary();
            });
            field.addEventListener("change", () => {
                if (!registrationForm.classList.contains("was-validated")) return;
                updateFieldError(field);
                updateErrorSummary();
            });
        });

        registrationForm.addEventListener("submit", (event) => {
            event.preventDefault();
            registrationForm.classList.add("was-validated");
            registrationFields.forEach(updateFieldError);

            const firstInvalidField = registrationFields.find((field) => !field.validity.valid);
            updateErrorSummary();
            if (firstInvalidField) {
                firstInvalidField.focus();
                return;
            }

            alert("Registration details validated successfully!");
        });
    </script>
</body>
</html>
