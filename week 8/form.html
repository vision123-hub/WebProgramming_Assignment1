<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Session Sign In</title>
    <style>
        :root {
            --brand-color: #1e4638;
            --brand-deep: #112921;
            --surface-card: #ffffff;
            --body-bg: #f0f4f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: var(--body-bg); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
        .auth-container { background: var(--surface-card); width: 100%; max-width: 400px; padding: 2.75rem 2.25rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04); }
        .auth-header { text-align: center; color: var(--brand-color); font-size: 1.65rem; font-weight: 800; margin-bottom: 2.25rem; }
        .auth-row { margin-bottom: 1.35rem; display: flex; flex-direction: column; gap: 0.45rem; }
        .auth-row label { font-size: 0.85rem; font-weight: 700; color: #374151; }
        .auth-input-element { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.95rem; color: #111827; outline: none; background: #ffffff; }
        .auth-input-element::placeholder { color: #9ca3af; }
        .auth-input-element:focus { border-color: var(--brand-color); }
        .auth-persistence-option { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #4b5563; font-weight: 600; margin: 1.75rem 0; cursor: pointer; user-select: none; }
        .auth-persistence-option input { width: 1.1rem; height: 1.1rem; border: 1px solid #d1d5db; border-radius: 0.25rem; cursor: pointer; }
        .auth-action-trigger { width: 100%; padding: 0.85rem; background-color: var(--brand-color); color: #ffffff; border: none; border-radius: 0.5rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        .auth-action-trigger:hover { background-color: var(--brand-deep); }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 class="auth-header">Sign In</h2>
        <form onsubmit="event.preventDefault(); alert('Authentication parameters serialized.');">
            <div class="auth-row">
                <label for="authEmail">Email Address</label>
                <input type="email" id="authEmail" class="auth-input-element" required placeholder="Enter your email">
            </div>
            <div class="auth-row">
                <label for="authPass">Password</label>
                <input type="password" id="authPass" class="auth-input-element" required placeholder="Enter your password">
            </div>
            <label class="auth-persistence-option">
                <input type="checkbox" id="authKeepLogged">
                Remember me
            </label>
            <button type="submit" class="auth-action-trigger">Sign In</button>
        </form>
    </div>
</body>
</html>
