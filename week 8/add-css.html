<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Styles Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .skip-link {
            position: absolute;
            top: -4rem;
            left: 1rem;
            z-index: 1000;
            padding: 0.75rem 1rem;
            background: #ffffff;
            color: #212529;
            border: 2px solid #0d6efd;
            border-radius: 0.25rem;
        }
        .skip-link:focus {
            top: 1rem;
            outline: 3px solid #facc15;
            outline-offset: 2px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            padding: 3rem 2.5rem;
        }
        .demo-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }
        .form-container {
            max-width: 400px;
            width: 100%;
        }
        .form-input-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #000000;
        }
        .input-box {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #212529;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .input-box::placeholder {
            color: #adb5bd;
            opacity: 1;
        }
        .input-box:focus {
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        form.was-validated .input-box:valid {
            border-color: #15803d;
        }
        form.was-validated .input-box:invalid {
            border-color: #b91c1c;
        }
        .validation-feedback {
            color: #b91c1c;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .validation-feedback[hidden] {
            display: none;
        }
        .submit-trigger-btn {
            display: inline-block;
            padding: 0.65rem 1.25rem;
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.15s ease-in-it;
            margin-top: 0.5rem;
        }
        .submit-trigger-btn:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    <main class="form-container" id="main-content" tabindex="-1">
        <h1 class="demo-title">Validation Styles Demo</h1>
        <form id="validation-form" novalidate>
            
            <div class="form-input-group">
                <label for="userEmail">Email (required)</label>
                <input type="email" id="userEmail" class="input-box" required placeholder="name@example.com">
            </div>

            <div class="form-input-group">
                <label for="userPassword">Password (min 8 chars)</label>
                <input type="password" id="userPassword" class="input-box" required placeholder="At least 8 characters" minlength="8">
            </div>

            <div class="form-input-group">
                <label for="userAge">Age (18–65)</label>
                <input type="number" id="userAge" class="input-box" required placeholder="Your age" min="18" max="65">
            </div>

            <p class="validation-feedback" id="validation-feedback" role="alert" aria-live="assertive" hidden></p>
            <button type="submit" class="submit-trigger-btn">Check Validation</button>
        </form>
    </main>

    <script>
        const validationForm = document.getElementById("validation-form");
        const validationFeedback = document.getElementById("validation-feedback");
        const validationFields = Array.from(validationForm.querySelectorAll(".input-box"));

        function updateValidationFeedback() {
            const invalidFields = validationFields.filter((field) => !field.validity.valid);
            validationFields.forEach((field) => {
                if (field.validity.valid) {
                    field.removeAttribute("aria-invalid");
                    field.removeAttribute("aria-describedby");
                } else {
                    field.setAttribute("aria-invalid", "true");
                }
            });

            const firstInvalidField = invalidFields[0];
            validationFeedback.hidden = !firstInvalidField;
            validationFeedback.textContent = firstInvalidField
                ? firstInvalidField.validationMessage
                : "";
            if (firstInvalidField) {
                firstInvalidField.setAttribute("aria-describedby", "validation-feedback");
            }
            return firstInvalidField;
        }

        validationForm.addEventListener("submit", (event) => {
            event.preventDefault();
            validationForm.classList.add("was-validated");
            const firstInvalidField = updateValidationFeedback();
            if (firstInvalidField) {
                firstInvalidField.focus();
                return;
            }
            alert("Form structural validation passed successfully!");
        });

        validationFields.forEach((field) => {
            field.addEventListener("input", () => {
                if (validationForm.classList.contains("was-validated")) {
                    updateValidationFeedback();
                }
            });
        });
    </script>
</body>
</html>
