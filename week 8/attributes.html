<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gachon Registration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            padding: 3rem 2.5rem;
        }
        .portal-form-wrapper {
            max-width: 400px;
            width: 100%;
        }
        .portal-main-heading {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f5132;
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }
        .portal-input-container {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .portal-input-container label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #212529;
        }
        .portal-entry-field {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #212529;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.15s ease-in-out;
        }
        .portal-entry-field::placeholder {
            color: #adb5bd;
        }
        .portal-entry-field:focus {
            border-color: #0f5132;
            box-shadow: 0 0 0 0.25rem rgba(15, 81, 50, 0.15);
        }
        .portal-submit-trigger {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background-color: #0f5132;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.15s ease-in-out;
        }
        .portal-submit-trigger:hover {
            background-color: #146c43;
        }
    </style>
</head>
<body>

    <div class="portal-form-wrapper">
        <h1 class="portal-main-heading">Gachon Registration</h1>
        <form onsubmit="event.preventDefault(); alert('Gachon Registration submitted successfully!');">
            
            <div class="portal-input-container">
                <label for="gachonStudentId">Student ID</label>
                <input type="text" id="gachonStudentId" class="portal-entry-field" required placeholder="202112345" pattern="[0-9]+">
            </div>

            <div class="portal-input-container">
                <label for="gachonEmail">Email</label>
                <input type="email" id="gachonEmail" class="portal-entry-field" required placeholder="name@gachon.ac.kr">
            </div>

            <div class="portal-input-container">
                <label for="gachonPassword">Password</label>
                <input type="password" id="gachonPassword" class="portal-entry-field" required placeholder="At least 8 characters" minlength="8">
            </div>

            <div class="portal-input-container">
                <label for="gachonAge">Age</label>
                <input type="number" id="gachonAge" class="portal-entry-field" required placeholder="Your age">
            </div>

            <button type="submit" class="portal-submit-trigger">Register</button>
        </form>
    </div>

</body>
</html>
