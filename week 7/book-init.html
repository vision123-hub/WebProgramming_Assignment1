<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Lookup v1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #ffffff; padding: 3rem 1.5rem; display: flex; flex-direction: column; align-items: center; }
        .lookup-init-title { font-size: 2.25rem; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -0.02em; color: #0f172a; }
        .lookup-init-bar { display: flex; gap: 0.5rem; width: 100%; max-width: 480px; }
        .lookup-init-field { flex: 1; padding: 0.6rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
        .lookup-init-trigger { padding: 0.6rem 1.25rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <h1 class="lookup-init-title">📚 Book Search</h1>
    <form class="lookup-init-bar" onsubmit="event.preventDefault();">
        <input type="text" class="lookup-init-field" placeholder="Enter title keywords...">
        <button type="submit" class="lookup-init-trigger">Search</button>
    </form>
</body>
</html>
