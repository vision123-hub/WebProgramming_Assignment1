<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Book Search Setup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 40px 15px;
    }
    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0001;
    }
    input {
      padding: 12px;
      width: 65%;
      border: 1px solid #aaa;
      border-radius: 8px;
    }
    button {
      padding: 12px 20px;
      background: #4355db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #2939a5; }
    #message { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Book Finder</h1>
    <p>Find your next favorite book!</p>

    <form id="searchForm">
      <input id="bookInput" type="search"
             placeholder="Enter a book title..." required>
      <button type="submit">Search</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("bookInput");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) {
        message.textContent = "Please enter a book title.";
        return;
      }

      message.textContent = "You searched for: " + query;
    });
  </script>
</body>
</html>
