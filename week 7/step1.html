<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Pipeline - Phase 1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #ffffff; padding: 2rem; }
        .st1-card-title { font-size: 2rem; font-weight: 700; margin-bottom: 1.5rem; }
        .st1-card-form { display: flex; gap: 0.5rem; max-width: 500px; margin-bottom: 2rem; }
        .st1-card-input { flex: 1; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; outline: none; }
        .st1-card-btn { padding: 0.5rem 1rem; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .st1-card-results { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1 class="st1-card-title">📚 Book Search</h1>
    <form class="st1-card-form" onsubmit="event.preventDefault();">
        <input type="text" class="st1-card-input" placeholder="Search books...">
        <button type="submit" class="st1-card-btn">Search</button>
    </form>
    <h2 class="st1-card-results">Results</h2>
</body>
</html>
