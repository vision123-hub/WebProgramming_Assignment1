<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Pipeline - Phase 6</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #f8f9fa; color: #212529; }
        .st6-final-banner { background-color: #1e293b; color: #ffffff; padding: 3rem 1rem; text-align: center; }
        .st6-final-banner h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.025em; }
        .st6-final-tagline { color: #94a3b8; font-size: 1rem; font-weight: 500; }
        .st6-final-scaffold { max-width: 500px; margin: -1.5rem auto 0 auto; padding: 0 1rem; }
        .st6-final-dock { background: #ffffff; padding: 1.25rem; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .st6-final-input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; color: #0f172a; }
        .st6-final-btn { padding: 0.75rem 1.5rem; background-color: #0d6efd; color: #ffffff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .st6-final-hint { font-size: 0.9rem; color: #2563eb; font-weight: 600; margin-left: 0.25rem; margin-bottom: 2rem; }
        .st6-final-results { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-top: 1rem; }
    </style>
</head>
<body>
    <header class="st6-final-banner">
        <h1>📚 Book Search</h1>
        <p class="st6-final-tagline">Discover your next favorite book</p>
    </header>
    <main class="st6-final-scaffold">
        <form class="st6-final-dock" onsubmit="event.preventDefault();">
            <input type="text" class="st6-final-input" placeholder="Search books...">
            <button type="submit" class="st6-final-btn">Search</button>
        </form>
        <div class="st6-final-hint">Search for your favorite books!</div>
        <h2 class="st6-final-results">Results</h2>
    </main>
</body>
</html>
