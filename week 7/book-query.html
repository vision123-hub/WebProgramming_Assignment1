<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - API Query</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f4ff;
      padding: 40px 15px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }
    input, button {
      padding: 12px;
      margin: 5px;
      border-radius: 8px;
    }
    input { border: 1px solid #aaa; }
    button {
      background: #4355db;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Search Books</h1>

    <form id="searchForm">
      <input id="query" type="search"
             placeholder="Search book title" required>
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status"></p>
    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) return;

      status.textContent = "Searching books...";
      results.replaceChildren();

      try {
        const url = "https://openlibrary.org/search.json?title="
          + encodeURIComponent(query)
          + "&limit=10";

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("API request failed.");
        }

        const data = await response.json();

        if (data.docs.length === 0) {
          status.textContent = "No books found.";
          return;
        }

        status.textContent =
          `Found ${data.numFound ?? data.num_found ?? data.docs.length} books.`;

        data.docs.forEach(function(book) {
          const div = document.createElement("div");
          div.className = "result";

          const title = document.createElement("h3");
          title.textContent = book.title || "Unknown title";

          const author = document.createElement("p");
          author.textContent = "Author: "
            + (book.author_name?.join(", ") || "Unknown");

          div.append(title, author);
          results.appendChild(div);
        });

      } catch (error) {
        status.textContent =
          "Something went wrong. Please try again.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
