<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Lookup v3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .lookup-query-hero { background-color: #1e293b; color: #ffffff; padding: 4rem 1rem; text-align: center; }
        .lookup-query-hero h1 { font-size: 2rem; font-weight: 800; }
        .lookup-query-workspace { max-width: 500px; margin: -1.5rem auto 0 auto; padding: 0 1rem; }
        .lookup-query-card { background: #ffffff; padding: 1.25rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .lookup-query-field { flex: 1; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
        .lookup-query-btn { padding: 0.75rem 1.5rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .lookup-query-status { font-size: 0.9rem; color: #64748b; margin-left: 0.25rem; font-weight: 500; }
    </style>
</head>
<body>
    <div class="lookup-query-hero">
        <h1>📚 Book Search</h1>
    </div>
    <div class="lookup-query-workspace">
        <form class="lookup-query-card" onsubmit="event.preventDefault();">
            <input type="text" class="lookup-query-field" placeholder="Search Open Library dataset...">
            <button type="submit" class="lookup-query-btn">Search</button>
        </form>
        <div class="lookup-query-status">Enter a book title to get started.</div>
    </div>
</body>
</html>
