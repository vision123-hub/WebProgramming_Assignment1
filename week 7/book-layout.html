<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Book Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      margin: 0;
      padding: 30px 15px;
    }
    h1, .intro { text-align: center; }
    .books {
      max-width: 1000px;
      margin: 30px auto;
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .book {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 12px #0001;
    }
    .book img {
      width: 130px;
      height: 190px;
      object-fit: cover;
      border-radius: 5px;
    }
    .book h2 { font-size: 18px; }
  </style>
</head>
<body>
  <h1>📚 Book Finder</h1>
  <p class="intro">Explore our book collection!</p>

  <main class="books">
    <article class="book">
      <img src="https://covers.openlibrary.org/b/isbn/9780439708180-M.jpg"
           alt="Harry Potter book cover">
      <h2>Harry Potter and the Sorcerer's Stone</h2>
      <p>Author: J. K. Rowling</p>
      <p>First published: 1997</p>
    </article>

    <article class="book">
      <img src="https://covers.openlibrary.org/b/isbn/9780547928227-M.jpg"
           alt="The Hobbit book cover">
      <h2>The Hobbit</h2>
      <p>Author: J. R. R. Tolkien</p>
      <p>First published: 1937</p>
    </article>

    <article class="book">
      <img src="https://covers.openlibrary.org/b/isbn/9780141439518-M.jpg"
           alt="Pride and Prejudice book cover">
      <h2>Pride and Prejudice</h2>
      <p>Author: Jane Austen</p>
      <p>First published: 1813</p>
    </article>
  </main>
</body>
</html>
