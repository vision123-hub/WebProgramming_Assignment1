<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 6 - Complete Book Finder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f3ff;
      color: #252b46;
    }

    header {
      background: linear-gradient(135deg, #4355db, #8b5cf6);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 25px;
    }

    .search-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0001;
      text-align: center;
    }

    form {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    input {
      padding: 14px;
      width: min(100%, 400px);
      border: 1px solid #bbb;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      padding: 13px 20px;
      background: #4355db;
      color: white;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #2d3eb5;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 25px 0;
    }

    #status {
      text-align: center;
      min-height: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .book {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px #0001;
    }

    .book img {
      width: 130px;
      height: 190px;
      object-fit: cover;
      border-radius: 6px;
    }

    .book h2 {
      font-size: 18px;
      min-height: 45px;
    }

    .book p {
      font-size: 14px;
    }

    .book a {
      display: block;
      color: #4355db;
      margin: 12px 0;
      font-weight: bold;
    }

    .favorite {
      background: #e85d8a;
    }

    .favorite:hover {
      background: #c43b6a;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }

      main {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 My Book Finder</h1>
    <p>Find amazing books and save your favorites!</p>
  </header>

  <main>

    <section class="search-box">
      <h2>What would you like to read?</h2>

      <form id="searchForm">
        <input
          id="searchInput"
          type="search"
          placeholder="Search for a book..."
          required
        >

        <button id="searchButton" type="submit">
          🔍 Search
        </button>
      </form>
    </section>

    <div class="tabs">
      <button id="resultsButton" type="button">
        📚 Search Results
      </button>

      <button id="favoritesButton" type="button">
        ❤️ My Favorites
      </button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="books" class="grid"></section>

  </main>

  <footer>
    <p>Book data provided by Open Library</p>
  </footer>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");

    const resultsButton =
      document.getElementById("resultsButton");

    const favoritesButton =
      document.getElementById("favoritesButton");

    const status = document.getElementById("status");
    const booksContainer = document.getElementById("books");

    let currentBooks = [];
    let currentView = "results";

    function getFavorites() {
      try {
        return JSON.parse(
          localStorage.getItem("favoriteBooks") || "[]"
        );
      } catch (error) {
        console.error(error);
        return [];
      }
    }

    function saveFavorites(favorites) {
      try {
        localStorage.setItem(
          "favoriteBooks",
          JSON.stringify(favorites)
        );
        return true;
      } catch (error) {
        console.error(error);
        status.textContent =
          "Could not save favorites in this browser.";
        return false;
      }
    }

    function isFavorite(book) {
      return getFavorites().some(
        item => item.key === book.key
      );
    }

    function toggleFavorite(book) {
      let favorites = getFavorites();

      if (isFavorite(book)) {
        favorites = favorites.filter(
          item => item.key !== book.key
        );
      } else {
        favorites.push(book);
      }

      if (!saveFavorites(favorites)) return;

      if (currentView === "favorites") {
        showFavorites();
      } else {
        displayBooks(currentBooks);
      }
    }

    function displayBooks(bookList) {
      booksContainer.replaceChildren();

      bookList.forEach(book => {
        const card = document.createElement("article");
        card.className = "book";

        const image = document.createElement("img");

        image.src = book.cover_i
          ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
          : "https://placehold.co/130x190?text=No+Cover";

        image.alt = "Cover of " + book.title;
        image.loading = "lazy";

        const title = document.createElement("h2");
        title.textContent = book.title || "Unknown title";

        const author = document.createElement("p");
        author.textContent = "✍️ " +
          (book.author_name?.join(", ") || "Unknown author");

        const year = document.createElement("p");
        year.textContent = "📅 " +
          (book.first_publish_year || "Unknown");

        const link = document.createElement("a");
        link.href = "https://openlibrary.org" + book.key;
        link.textContent = "View on Open Library";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const favoriteButton =
          document.createElement("button");

        favoriteButton.type = "button";
        favoriteButton.className = "favorite";

        favoriteButton.textContent = isFavorite(book)
          ? "❤️ Remove Favorite"
          : "🤍 Add Favorite";

        favoriteButton.addEventListener("click", () => {
          toggleFavorite(book);
        });

        card.append(
          image,
          title,
          author,
          year,
          link,
          favoriteButton
        );

        booksContainer.appendChild(card);
      });
    }

    async function searchBooks(query) {
      currentView = "results";
      currentBooks = [];

      searchButton.disabled = true;
      status.textContent = "⏳ Searching books...";
      booksContainer.replaceChildren();

      try {
        const url = new URL(
          "https://openlibrary.org/search.json"
        );

        url.searchParams.set("title", query);
        url.searchParams.set("limit", "20");

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("API error: " + response.status);
        }

        const data = await response.json();

        currentBooks = data.docs || [];

        if (currentBooks.length === 0) {
          status.textContent =
            "😕 No books found. Try another search.";
          return;
        }

        status.textContent =
          `📚 Showing ${currentBooks.length} books.`;

        displayBooks(currentBooks);

      } catch (error) {
        currentBooks = [];
        booksContainer.replaceChildren();
        status.textContent =
          "❌ Something went wrong. Please try again.";
        console.error(error);

      } finally {
        searchButton.disabled = false;
      }
    }

    function showFavorites() {
      currentView = "favorites";

      const favorites = getFavorites();

      if (favorites.length === 0) {
        booksContainer.replaceChildren();
        status.textContent =
          "❤️ You haven't saved any books yet.";
        return;
      }

      status.textContent =
        `❤️ You have ${favorites.length} favorite books.`;

      displayBooks(favorites);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) {
        status.textContent = "Please enter a book title.";
        return;
      }

      searchBooks(query);
    });

    favoritesButton.addEventListener(
      "click",
      showFavorites
    );

    resultsButton.addEventListener("click", () => {
      currentView = "results";
      displayBooks(currentBooks);

      status.textContent = currentBooks.length
        ? `Showing ${currentBooks.length} books.`
        : "Search for a book to get started.";
    });

    status.textContent =
      "👋 Welcome! Search for your favorite book.";

  </script>
</body>
</html>
