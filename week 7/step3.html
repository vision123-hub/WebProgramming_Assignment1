<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Pipeline - Phase 3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #f8f9fa; color: #212529; }
        .st3-grid-top { background-color: #1e293b; color: #ffffff; padding: 3.5rem 1rem; text-align: center; }
        .st3-grid-top h1 { font-size: 2rem; font-weight: 700; }
        .st3-grid-scaffold { max-width: 500px; margin: -1.5rem auto 0 auto; padding: 0 1rem; }
        .st3-grid-dock { background: #ffffff; padding: 1.25rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .st3-grid-input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
        .st3-grid-btn { padding: 0.75rem 1.5rem; background-color: #0d6efd; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; }
        .st3-grid-results { font-size: 1.5rem; font-weight: 700; color: #212529; }
    </style>
</head>
<body>
    <div class="st3-grid-top">
        <h1>📚 Book Search</h1>
    </div>
    <div class="st3-grid-scaffold">
        <form class="st3-grid-dock" onsubmit="event.preventDefault();">
            <input type="text" class="st3-grid-input" placeholder="Search books...">
            <button type="submit" class="st3-grid-btn">Search</button>
        </form>
        <h2 class="st3-grid-results">Results</h2>
    </div>
</body>
</html>
