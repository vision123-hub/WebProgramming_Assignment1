<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 7 - Advanced Book Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5ff;
      color: #252b46;
    }

    header {
      text-align: center;
      background: #4355db;
      color: white;
      padding: 40px 20px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .search-area {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0001;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    input, select {
      padding: 13px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      width: min(100%, 350px);
    }

    button {
      padding: 13px 22px;
      background: #4355db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #2b3ab2;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #status {
      text-align: center;
      margin: 25px 0;
    }

    #results {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .book {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 12px #0001;
    }

    .book img {
      width: 130px;
      height: 190px;
      object-fit: cover;
      border-radius: 6px;
    }

    .book h2 {
      font-size: 18px;
    }

    .book p {
      font-size: 14px;
    }

    .book a {
      color: #4355db;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 Advanced Book Search</h1>
    <p>Find books by title, author, or keyword!</p>
  </header>

  <main>

    <section class="search-area">
      <form id="searchForm">

        <select id="searchType"
                aria-label="Search category">
          <option value="title">Book Title</option>
          <option value="author">Author</option>
          <option value="q">All Keywords</option>
        </select>

        <input
          id="searchInput"
          type="search"
          placeholder="Enter your search..."
          required
        >

        <button id="searchButton" type="submit">
          🔍 Search
        </button>

      </form>
    </section>

    <p id="status" role="status" aria-live="polite">
      Enter a search to discover books.
    </p>

    <section id="results"></section>

  </main>

  <footer>
    <p>Powered by Open Library API</p>
  </footer>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const type = document.getElementById("searchType");
    const button = document.getElementById("searchButton");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) {
        status.textContent = "Please enter a search term.";
        return;
      }

      button.disabled = true;
      results.replaceChildren();
      status.textContent = "⏳ Searching Open Library...";

      try {
        const url = new URL(
          "https://openlibrary.org/search.json"
        );

        url.searchParams.set(type.value, query);
        url.searchParams.set("limit", "20");

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            "HTTP error: " + response.status
          );
        }

        const data = await response.json();

        if (!data.docs || data.docs.length === 0) {
          status.textContent =
            "😕 No matching books found.";
          return;
        }

        const total =
          data.numFound ?? data.num_found ?? data.docs.length;

        status.textContent =
          `✅ Found ${total} matching books. Showing ${data.docs.length}.`;

        data.docs.forEach(function(book) {
          const card = document.createElement("article");
          card.className = "book";

          const image = document.createElement("img");

          image.src = book.cover_i
            ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
            : "https://placehold.co/130x190?text=No+Cover";

          image.alt = "Cover of " + book.title;
          image.loading = "lazy";

          const title = document.createElement("h2");
          title.textContent =
            book.title || "Unknown title";

          const author = document.createElement("p");
          author.textContent = "✍️ Author: " +
            (book.author_name?.join(", ") || "Unknown");

          const year = document.createElement("p");
          year.textContent = "📅 First published: " +
            (book.first_publish_year || "Unknown");

          const link = document.createElement("a");

          link.href =
            "https://openlibrary.org" + book.key;

          link.textContent = "View Book →";
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          card.append(
            image,
            title,
            author,
            year,
            link
          );

          results.appendChild(card);
        });

      } catch (error) {
        status.textContent =
          "❌ Unable to search books. Please try again.";
        console.error(error);

      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
