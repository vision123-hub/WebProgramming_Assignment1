<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer Engine - Standalone</title>
    <style>
        /* Modern Dark Layout Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 1.5rem;
        }

        /* Centralized Layout Board Container */
        .search-engine-board {
            background-color: #111c3a;
            width: 100%;
            max-width: 680px;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            border: 1px solid #1e295d;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Primary Internal Icon Header */
        .brand-title-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .brand-icon {
            font-size: 1.4rem;
        }
        .brand-main-text {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .brand-subtitle-text {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }

        /* Interactive Search Control Block */
        .input-dock-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .text-entry-field {
            flex: 1;
            padding: 0.85rem 1.25rem;
            background-color: #172554;
            border: 1px solid #1e3a8a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .text-entry-field:focus {
            border-color: #38bdf8;
        }
        .text-entry-field::placeholder {
            color: #64748b;
        }
        .action-trigger-btn {
            padding: 0.85rem 1.75rem;
            background-color: #38bdf8;
            color: #0b1329;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .action-trigger-btn:hover {
            background-color: #7dd3fc;
        }

        /* Dynamic Blue Notice Label */
        .status-info-string {
            color: #2563eb;
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
            display: block;
            font-weight: 600;
        }

        .results-section-lbl {
            font-size: 1.35rem;
            font-weight: 700;
            text-align: left;
            border-bottom: 1px solid #1e295d;
            padding-bottom: 0.75rem;
            margin-bottom: 2.5rem;
        }

        /* Empty State Indicator Graphics */
        .empty-graphic-icon {
            font-size: 2rem;
            color: #64748b;
            margin-bottom: 1rem;
            display: inline-block;
        }
        .empty-graphic-fallback-text {
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Main Workspace Dashboard Card -->
    <div class="search-engine-board">
        
        <div class="brand-title-group">
            <span class="brand-icon">📚</span>
            <h2 class="brand-main-text">Book Search</h2>
        </div>
        <p class="brand-subtitle-text">Discover books by title using the Open Library Search API.</p>

        <form class="input-dock-row" onsubmit="event.preventDefault();">
            <input 
                type="text" 
                class="text-entry-field" 
                placeholder="Search books by title, author, or keyword..."
                required
            >
            <button type="submit" class="action-trigger-btn">Search</button>
        </form>

        <span class="status-info-string">Search by book title or author to get started.</span>

        <h3 class="results-section-lbl">Results</h3>

        <!-- Dynamic Lower Fallback Graphic Layout Area -->
        <div class="empty-graphic-container">
            <span class="empty-graphic-icon">🔍</span>
            <p class="empty-graphic-fallback-text">Enter a book title to get started.</p>
        </div>

    </div>

</body>
</html>
