<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Engine Registry</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; color: #212529; }
        .srch-box-banner { background-color: #1e293b; color: #ffffff; padding: 3rem 1rem; text-align: center; }
        .srch-box-banner h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
        .srch-box-subtitle { color: #94a3b8; font-size: 1rem; font-weight: 500; }
        .srch-box-scaffold { max-width: 500px; margin: -1.5rem auto 0 auto; padding: 0 1rem; }
        .srch-box-dock { background: #ffffff; padding: 1.25rem; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .srch-box-input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; color: #0f172a; }
        .srch-box-input:focus { border-color: #2563eb; }
        .srch-box-input::placeholder { color: #94a3b8; }
        .srch-box-btn { padding: 0.75rem 1.5rem; background-color: #0d6efd; color: #ffffff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .srch-box-btn:hover { background-color: #0b5ed7; }
        .srch-box-status { font-size: 0.9rem; color: #2563eb; font-weight: 600; margin-left: 0.25rem; margin-bottom: 2rem; }
        .srch-box-results-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-top: 1rem; }
    </style>
</head>
<body>
    <header class="srch-box-banner">
        <h1>📚 Book Search</h1>
        <p class="srch-box-subtitle">Discover your next favorite book</p>
    </header>
    <main class="srch-box-scaffold">
        <form class="srch-box-dock" onsubmit="processLocalSearch(event)">
            <input type="text" id="engineInputField" class="srch-box-input" placeholder="Search books..." required>
            <button type="submit" class="srch-box-btn">Search</button>
        </form>
        <div class="srch-box-status" id="engineStatusLabel">Search by book title or author to get started.</div>
        <h2 class="srch-box-results-title">Results</h2>
    </main>
    <script>
        function processLocalSearch(event) {
            event.preventDefault();
            const textVal = document.getElementById('engineInputField').value.trim();
            if (textVal) {
                document.getElementById('engineStatusLabel').textContent = "Discover your next favorite book";
            }
        }
    </script>
</body>
</html>
