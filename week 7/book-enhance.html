<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5 - Enhanced Book Search</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5ff;
      color: #25304b;
    }

    header {
      background: #4355db;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    form {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    input {
      padding: 13px;
      width: min(100%, 350px);
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    button {
      background: #4355db;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 13px 25px;
      cursor: pointer;
    }

    button:hover { background: #2838a4; }
    button:disabled { opacity: 0.6; }

    #status {
      text-align: center;
      margin: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }

    .book {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px #0001;
    }

    .book img {
      width: 130px;
      height: 190px;
      object-fit: cover;
      border-radius: 6px;
    }

    .book h2 { font-size: 18px; }

    .book a {
      color: #4355db;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 Book Explorer</h1>
    <p>Search thousands of books for free!</p>
  </header>

  <main>
    <form id="form">
      <input id="query" type="search"
             placeholder="Try Harry Potter..." required>
      <button id="button" type="submit">Find Books</button>
    </form>

    <p id="status" role="status"></p>
    <section id="results" class="grid"></section>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("query");
    const button = document.getElementById("button");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) {
        status.textContent = "Please enter a book title.";
        results.replaceChildren();
        return;
      }

      button.disabled = true;
      status.textContent = "📖 Finding your books...";
      results.replaceChildren();

      try {
        const url = new URL(
          "https://openlibrary.org/search.json"
        );

        url.searchParams.set("title", query);
        url.searchParams.set("limit", "12");

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        if (!data.docs?.length) {
          status.textContent = "No books found.";
          return;
        }

        status.textContent =
          `Found ${data.numFound ?? data.num_found ?? data.docs.length} matching books.`;

        data.docs.forEach((book) => {
          const card = document.createElement("article");
          card.className = "book";

          const image = document.createElement("img");

          image.src = book.cover_i
            ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
            : "https://placehold.co/130x190?text=No+Cover";

          image.alt = "Cover of " + book.title;
          image.loading = "lazy";

          const title = document.createElement("h2");
          title.textContent = book.title || "Unknown title";

          const author = document.createElement("p");
          author.textContent = "✍️ " +
            (book.author_name?.join(", ") || "Unknown author");

          const year = document.createElement("p");
          year.textContent = "📅 " +
            (book.first_publish_year || "Unknown");

          const link = document.createElement("a");
          link.textContent = "View Book →";
          link.href = "https://openlibrary.org" + book.key;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          card.append(image, title, author, year, link);
          results.appendChild(card);
        });

      } catch (error) {
        status.textContent =
          "❌ Unable to load books. Please try again.";
        console.error(error);

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
