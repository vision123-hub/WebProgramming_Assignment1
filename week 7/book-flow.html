<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Lookup v5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .lookup-flow-top { background-color: #1e293b; color: #ffffff; padding: 4rem 1rem; text-align: center; }
        .lookup-flow-top h1 { font-size: 2rem; font-weight: 800; }
        .lookup-flow-bounds { max-width: 500px; margin: -1.5rem auto 0 auto; padding: 0 1rem; }
        .lookup-flow-panel { background: #ffffff; padding: 1.25rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .lookup-flow-field { flex: 1; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
        .lookup-flow-btn { padding: 0.75rem 1.5rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; }
        .lookup-flow-status { font-size: 0.9rem; color: #2563eb; margin-left: 0.25rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="lookup-flow-top">
        <h1>📚 Book Search</h1>
    </div>
    <div class="lookup-flow-bounds">
        <form class="lookup-flow-panel" onsubmit="event.preventDefault();">
            <input type="text" class="lookup-flow-field" placeholder="Search Open Library dataset...">
            <button type="submit" class="lookup-flow-btn">Search</button>
        </form>
        <div class="lookup-flow-status">Search for your favorite books!</div>
    </div>
</body>
</html>
