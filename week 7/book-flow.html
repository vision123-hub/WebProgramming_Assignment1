<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Book Search Flow</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      padding: 30px 15px;
      text-align: center;
    }
    .container {
      max-width: 750px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
    }
    input, button {
      padding: 12px;
      border-radius: 8px;
      margin: 5px;
    }
    input { border: 1px solid #aaa; }
    button {
      border: none;
      background: #4355db;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    .book {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="container">
    <h1>📚 Book Search</h1>
    <p>Discover books using Open Library.</p>

    <form id="form">
      <input id="query" type="search"
             placeholder="Enter book title" required>
      <button id="searchBtn" type="submit">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="results"></div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("query");
    const button = document.getElementById("searchBtn");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) {
        status.className = "";
        status.textContent = "Please enter a book title.";
        results.replaceChildren();
        return;
      }

      button.disabled = true;
      status.className = "";
      status.textContent = "⏳ Loading books...";
      results.replaceChildren();

      try {
        const url = new URL(
          "https://openlibrary.org/search.json"
        );

        url.searchParams.set("title", query);
        url.searchParams.set("limit", "12");

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("HTTP error: " + response.status);
        }

        const data = await response.json();

        if (!data.docs || data.docs.length === 0) {
          status.textContent =
            "😕 No books found. Try another title.";
          return;
        }

        status.textContent =
          `✅ Showing ${data.docs.length} books.`;

        data.docs.forEach((book) => {
          const card = document.createElement("article");
          card.className = "book";

          const title = document.createElement("h3");
          title.textContent = book.title || "Unknown title";

          const author = document.createElement("p");
          author.textContent = "Author: " +
            (book.author_name?.join(", ") || "Unknown");

          const year = document.createElement("p");
          year.textContent = "First published: " +
            (book.first_publish_year || "Unknown");

          card.append(title, author, year);
          results.appendChild(card);
        });

      } catch (error) {
        status.className = "error";
        status.textContent =
          "❌ Could not load books. Check your connection.";
        console.error(error);

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
