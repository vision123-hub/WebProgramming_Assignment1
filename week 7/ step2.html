<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Pipeline - Phase 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #ffffff; }
        .st2-node-header { background-color: #1e293b; color: white; padding: 2.5rem 1rem; text-align: center; }
        .st2-node-header h1 { font-size: 2rem; font-weight: 700; }
        .st2-node-body { max-width: 500px; margin: 2.5rem auto 0 auto; padding: 0 1rem; }
        .st2-node-form { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .st2-node-input { flex: 1; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; }
        .st2-node-btn { padding: 0.5rem 1rem; background-color: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: 600; }
        .st2-node-results { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body>
    <header class="st2-node-header">
        <h1>📚 Book Search</h1>
    </header>
    <main class="st2-node-body">
        <form class="st2-node-form" onsubmit="event.preventDefault();">
            <input type="text" class="st2-node-input" placeholder="Search books...">
            <button type="submit" class="st2-node-btn">Search</button>
        </form>
        <h2 class="st2-node-results">Results</h2>
    </main>
</body>
</html>
